[build]
  publish = "."
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
[build.environment]
  NODE_VERSION = "18"
# Push changed outreach businesses to the Business CRM in Abrevo, hourly.
[functions."business-crm-sync"]
  schedule = "@hourly"
